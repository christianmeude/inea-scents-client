name: Sync API Client

on:
  pull_request:
    paths:
      - 'api-docs.json'

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Install dependencies
        run: flutter pub get
        
      - name: Run Swagger Parser
        run: dart run swagger_parser
        
      - name: Run Build Runner
        run: dart run build_runner build -d
        
      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-regenerate API client from latest schema"
          file_pattern: "lib/api/**"
          
      - name: Verify generated code compiles
        run: flutter analyze
