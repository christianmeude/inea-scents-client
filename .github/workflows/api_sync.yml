name: Sync API Client

on:
  push:
    branches:
      - 'api-sync-*'
    paths:
      - 'api-docs.json'

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.MOBILE_REPO_PAT }}
          
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Install dependencies
        run: flutter pub get
        
      - name: Run Swagger Parser
        run: dart run swagger_parser

      - name: Run Build Runner
        run: dart run build_runner build -d

      - name: Verify no manual drift (12-Factor contract guard)
        run: |
          if ! git diff --quiet lib/api/; then
            echo "::error::Generated lib/api/ differs from committed. Run: dart run swagger_parser && dart run build_runner build -d"
            git diff --stat lib/api/
            exit 1
          fi
        
      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-regenerate API client from latest schema"
          file_pattern: "lib/api/**"
          commit_user_name: "Christian Meude"
          commit_user_email: "christianmeude17@gmail.com"
          commit_author: "Christian Meude <christianmeude17@gmail.com>"
          

  create-pr:
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create Pull Request
        env:
          GITHUB_TOKEN: ${{ secrets.MOBILE_REPO_PAT }}
        run: |
          # Check if PR already exists for this branch
          PR_EXISTS=$(gh pr list --head ${{ github.ref_name }} --json url -q 'length')
          if [ "$PR_EXISTS" -eq "0" ]; then
            gh pr create \
              --title "Automated API Schema Update" \
              --body "This PR was automatically generated by the CI pipeline. It contains the latest api-docs.json schema and the generated Dart/Freezed API models. GitHub Actions will run the Flutter CI suite on this PR." \
              --base main \
              --head ${{ github.ref_name }}
          else
            echo "PR already exists"
          fi
