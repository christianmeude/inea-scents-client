name: Sync API Client

on:
  schedule:
    - cron: '0 0 * * *' # Nightly sync
  workflow_dispatch: # Allow manual triggers
  repository_dispatch:
    types: [backend_schema_updated] # Allow backend to trigger this directly via webhook

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
          
      - name: Fetch Latest API Schema
        run: curl -sSL "https://inea-scents.onrender.com/docs?api-docs.json" -o api-docs.json
          
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Install dependencies
        run: flutter pub get
        
      - name: Run Swagger Parser
        run: dart run swagger_parser
        
      - name: Run Build Runner
        run: dart run build_runner build -d
        
      - name: Verify generated code compiles
        run: flutter analyze
          
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: auto-regenerate API client from latest schema"
          title: "Update API Client Schema"
          body: "Automated PR to sync API client with the latest production schema."
          branch: "api-sync/auto-update"
          base: main
          delete-branch: true
